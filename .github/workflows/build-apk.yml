name: Build APK - دليني

on:
  push:
    branches: [ dalini-aqsa ]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'رابط الخادم'
        required: false
        default: 'https://dalini-aqsa-gv2p.onrender.com'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: تثبيت الحزم
        working-directory: app
        run: flutter pub get

      - name: توليد android إن لم يكن موجوداً
        working-directory: app
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.dalini --project-name dalini_aqsa .
          fi

      - name: تحديث Kotlin إلى 2.0.0
        working-directory: app
        run: |
          if [ -f android/settings.gradle ]; then
            sed -i "s/id \"org.jetbrains.kotlin.android\" version \"[^\"]*\"/id \"org.jetbrains.kotlin.android\" version \"2.0.0\"/g" android/settings.gradle
          fi
          if [ -f android/build.gradle ]; then
            sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '2.0.0'/g" android/build.gradle
          fi

      - name: إضافة صلاحيات INTERNET + الإشعارات + الكاميرا
        working-directory: app
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          echo "📄 المحتوى الأصلي:"
          cat "$MANIFEST"
          echo ""
          # INTERNET
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
            echo "✅ INTERNET"
          fi
          # POST_NOTIFICATIONS
          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application|' "$MANIFEST"
            echo "✅ POST_NOTIFICATIONS"
          fi
          # SCHEDULE_EXACT_ALARM
          if ! grep -q "SCHEDULE_EXACT_ALARM" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <application|' "$MANIFEST"
            echo "✅ SCHEDULE_EXACT_ALARM"
          fi
          # CAMERA
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\n    <application|' "$MANIFEST"
            echo "✅ CAMERA"
          fi
          # READ_MEDIA_IMAGES (Android 13+)
          if ! grep -q "READ_MEDIA_IMAGES" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <application|' "$MANIFEST"
            echo "✅ READ_MEDIA_IMAGES"
          fi
          # READ_EXTERNAL_STORAGE (Android 12-)
          if ! grep -q "READ_EXTERNAL_STORAGE" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <application|' "$MANIFEST"
            echo "✅ READ_EXTERNAL_STORAGE"
          fi
          echo ""
          echo "📄 بعد التعديل:"
          cat "$MANIFEST"
          echo ""
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
            echo "✅ تمت إضافة INTERNET"
          fi
          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application|' "$MANIFEST"
            echo "✅ تمت إضافة POST_NOTIFICATIONS"
          fi
          if ! grep -q "SCHEDULE_EXACT_ALARM" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <application|' "$MANIFEST"
            echo "✅ تمت إضافة SCHEDULE_EXACT_ALARM"
          fi
          echo ""
          echo "📄 بعد التعديل:"
          cat "$MANIFEST"

      - name: تحليل الكود
        working-directory: app
        run: flutter analyze --no-fatal-infos || true

      - name: ترقية Android SDK إلى 35
        working-directory: app
        run: |
          echo "📄 قبل:"
          head -20 android/app/build.gradle
          python3 -c "
import re
p = 'android/app/build.gradle'
s = open(p).read()
s = re.sub(r'(compileSdkVersion|compileSdk)\s+\d+', r'compileSdk 35', s)
s = re.sub(r'(compileSdkVersion|compileSdk)\s+flutter\.\w+', r'compileSdk 35', s)
s = re.sub(r'(targetSdkVersion|targetSdk)\s+\d+', r'targetSdk 35', s)
s = re.sub(r'(targetSdkVersion|targetSdk)\s+flutter\.\w+', r'targetSdk 35', s)
open(p, 'w').write(s)
print('FIXED')
"
          echo "📄 بعد:"
          head -20 android/app/build.gradle

      - name: بناء APK
        working-directory: app
        run: |
          flutter build apk --release \
            --dart-define=API_URL=${{ github.event.inputs.api_url || 'https://dalini-aqsa-gv2p.onrender.com' }}

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: dalini-aqsa-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
