name: Build APK - دليني

on:
  push:
    branches: [ dalini-aqsa ]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'رابط الخادم'
        required: false
        default: 'https://dalini-aqsa-gv2p.onrender.com'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: تثبيت الحزم
        working-directory: app
        run: flutter pub get

      - name: توليد android إن لم يكن موجوداً
        working-directory: app
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.dalini --project-name dalini_aqsa .
          fi

      - name: تسمية التطبيق "دليني"
        working-directory: app
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="[^"]*"/android:label="دليني"/g' "$MANIFEST"
          echo "📄 label:"
          grep 'android:label' "$MANIFEST"

      - name: تحديث Kotlin إلى 2.0.0
        working-directory: app
        run: |
          if [ -f android/settings.gradle ]; then
            sed -i "s/id \"org.jetbrains.kotlin.android\" version \"[^\"]*\"/id \"org.jetbrains.kotlin.android\" version \"2.0.0\"/g" android/settings.gradle
          fi
          if [ -f android/build.gradle ]; then
            sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '2.0.0'/g" android/build.gradle
          fi

      - name: إضافة صلاحيات INTERNET + الإشعارات
        working-directory: app
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          echo "📄 المحتوى الأصلي:"
          cat "$MANIFEST"
          echo ""
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
            echo "✅ تمت إضافة INTERNET"
          fi
          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application|' "$MANIFEST"
            echo "✅ تمت إضافة POST_NOTIFICATIONS"
          fi
          if ! grep -q "SCHEDULE_EXACT_ALARM" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <application|' "$MANIFEST"
            echo "✅ تمت إضافة SCHEDULE_EXACT_ALARM"
          fi
          echo ""
          echo "📄 بعد التعديل:"
          cat "$MANIFEST"

      - name: تحليل الكود
        working-directory: app
        run: flutter analyze --no-fatal-infos || true

      - name: تحديث إصدار Android SDK إلى 35
        working-directory: app
        run: |
          python3 << 'PYSCRIPT'
          import re
          gradle_file = 'android/app/build.gradle'
           
          with open(gradle_file, 'r') as f:
              content = f.read()
           
          # تحديث compileSdkVersion إلى 35
          content = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 35', content)
          # تحديث targetSdkVersion إلى 35
          content = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 35', content)
          # تحديث minSdkVersion إلى 21
          content = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 21', content)
           
          with open(gradle_file, 'w') as f:
              f.write(content)
           
          print("✅ تم تحديث إصدارات Android SDK")
          PYSCRIPT

      - name: إعداد التوقيع (APK Signing)
        working-directory: app
        if: vars.KEYSTORE_FILE != '' && vars.KEYSTORE_PASSWORD != '' && vars.KEY_ALIAS != '' && vars.KEY_PASSWORD != ''
        run: |
          # فك تشفير الـ keystore من Base64 إلى ملف
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/dalini.jks
           
          # التحقق من الملف
          if [ -f "android/app/dalini.jks" ]; then
            echo "✅ تم إنشاء ملف التوقيع بنجاح"
            ls -lh android/app/dalini.jks
          else
            echo "❌ فشل إنشاء ملف التوقيع"
            exit 1
          fi
           
          # إنشاء ملف key.properties
          cat > android/key.properties << EOF
          storeFile=app/dalini.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
           
          # إضافة التوقيع إلى build.gradle
          python3 << 'PYSCRIPT'
          import re
           
          gradle_file = 'android/app/build.gradle'
          with open(gradle_file, 'r') as f:
              content = f.read()
           
          # البحث عن بداية تعريف signingConfigs أو android { block
          signing_config = '''
          signingConfigs {
              release {
                  keyAlias System.getenv("KEY_ALIAS") ?: ""
                  keyPassword System.getenv("KEY_PASSWORD") ?: ""
                  storeFile System.getenv("KEYSTORE_FILE") ? file(System.getenv("KEYSTORE_FILE")) : null
                  storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
              }
          }
          '''
           
          # إذا لم يكن موجوداً، أضفه بعد android {
          if 'signingConfigs' not in content:
              content = re.sub(
                  r'android\s*\{',
                  'android {\n    ' + signing_config.strip(),
                  content,
                  count=1
              )
           
          # تحديث buildTypes.release لاستخدام signingConfig
          content = re.sub(
              r'(buildTypes\s*\{\s*release\s*\{)',
              r'\1\n            signingConfig signingConfigs.release',
              content
          )
           
          with open(gradle_file, 'w') as f:
              f.write(content)
           
          print("✅ تم إضافة التوقيع إلى build.gradle")
          PYSCRIPT

      - name: توليد أيقونات التطبيق
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: بناء APK (مع التوقيع)
        working-directory: app
        env:
          KEYSTORE_FILE: ${{ vars.KEYSTORE_FILE || 'app/dalini.jks' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --dart-define=API_URL=${{ github.event.inputs.api_url || 'https://dalini-aqsa-gv2p.onrender.com' }}

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: dalini-aqsa-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
