name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Create Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.dalni . || flutter create --platforms=android .
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Update AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            python3 - <<'EOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          permissions = [
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.CAMERA"/>',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
          ]

          for perm in permissions:
              if perm not in content:
                  content = re.sub(r'(<manifest[^>]*>)', r'\1\n    ' + perm, content, count=1)

          content = re.sub(r'android:label="[^"]*"', 'android:label="دلني الأقصى"', content)

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          EOF
          fi

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          fi

      - name: Configure signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "android/app/keystore.jks" ]; then
            cat > android/key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=keystore.jks
          EOF

            BUILD_GRADLE="android/app/build.gradle"
            if [ ! -f "$BUILD_GRADLE" ]; then
              BUILD_GRADLE="android/app/build.gradle.kts"
            fi

            python3 - <<'EOF'
          import os, re
          path = "android/app/build.gradle"
          if not os.path.exists(path):
              path = "android/app/build.gradle.kts"

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          if "key.properties" not in content:
              if path.endswith(".kts"):
                  content = (
                      'import java.util.Properties\n'
                      'import java.io.FileInputStream\n\n'
                      'val keystoreProperties = Properties()\n'
                      'val keystorePropertiesFile = rootProject.file("key.properties")\n'
                      'if (keystorePropertiesFile.exists()) {\n'
                      '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n'
                      '}\n\n'
                  ) + content
                  content = content.replace(
                      "buildTypes {",
                      'signingConfigs {\n'
                      '    create("release") {\n'
                      '        keyAlias = keystoreProperties["keyAlias"] as String\n'
                      '        keyPassword = keystoreProperties["keyPassword"] as String\n'
                      '        storeFile = keystoreProperties["storeFile"]?.let { file(it) }\n'
                      '        storePassword = keystoreProperties["storePassword"] as String\n'
                      '    }\n'
                      '}\n'
                      'buildTypes {'
                  )
                  content = content.replace(
                      'getByName("release") {',
                      'getByName("release") {\n            signingConfig = signingConfigs.getByName("release")'
                  )
              else:
                  content = (
                      "def keystoreProperties = new Properties()\n"
                      "def keystorePropertiesFile = rootProject.file('key.properties')\n"
                      "if (keystorePropertiesFile.exists()) {\n"
                      "    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n"
                      "}\n\n"
                  ) + content
                  content = content.replace(
                      "buildTypes {",
                      "signingConfigs {\n"
                      "    release {\n"
                      "        keyAlias keystoreProperties['keyAlias']\n"
                      "        keyPassword keystoreProperties['keyPassword']\n"
                      "        storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null\n"
                      "        storePassword keystoreProperties['storePassword']\n"
                      "    }\n"
                      "}\n"
                      "buildTypes {"
                  )
                  content = content.replace(
                      "release {",
                      "release {\n            signingConfig signingConfigs.release"
                  )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          EOF
          fi

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
