name: Build APK - دليني

on:
  push:
    branches: [ dalini-aqsa ]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'رابط الخادم (Backend URL)'
        required: false
        default: 'https://dalini-aqsa-gv2p.onrender.com'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: تثبيت الحزم
        working-directory: app
        run: flutter pub get

      - name: توليد مجلد android إن لم يكن موجوداً
        working-directory: app
        run: |
          if [ ! -d "android" ]; then
            echo "🔨 توليد مجلد android..."
            flutter create --platforms=android --org com.dalini --project-name dalini_aqsa .
          else
            echo "✅ مجلد android موجود"
          fi

      - name: تحليل الكود
        working-directory: app
        run: flutter analyze --no-fatal-infos || true

      - name: بناء APK (Release)
        working-directory: app
        run: |
          flutter build apk --release \
            --dart-define=API_URL=${{ github.event.inputs.api_url || 'https://dalini-aqsa-gv2p.onrender.com' }}

      - name: رفع ملف التثبيت
        uses: actions/upload-artifact@v4
        with:
          name: dalini-aqsa-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
