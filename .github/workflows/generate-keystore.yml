name: Generate Keystore (temporary)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: توليد keystore
        run: |
          keytool -genkey -v \
            -keystore dalini.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias dalini \
            -storepass "Dalini2026!Secure" \
            -keypass "Dalini2026!Secure" \
            -dname "CN=Dalini, OU=Mobile, O=Dalini, L=Baghdad, S=Baghdad, C=IQ"

      - name: تحويل إلى base64
        run: |
          base64 -w 0 dalini.jks > dalini-base64.txt
          echo "═══ طول النص ═══"
          wc -c dalini-base64.txt

      - name: رفع الملفات
        uses: actions/upload-artifact@v4
        with:
          name: dalini-keystore
          path: |
            dalini.jks
            dalini-base64.txt
          retention-days: 1
