databases:
  - name: dalini-aqsa-db
    plan: free
    databaseName: dalini_aqsa
    user: dalini_aqsa

services:
  - type: web
    name: dalini-aqsa
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CODE_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dalini-aqsa-db
          property: connectionString
